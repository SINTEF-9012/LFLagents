services:
  neo4j:
    container_name: neo4j
    image: neo4j:latest
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      - NEO4J_apoc_export_file_enabled=${NEO4J_APOC_EXPORT_FILE_ENABLED}
      - NEO4J_apoc_import_file_enabled=${NEO4J_APOC_IMPORT_FILE_ENABLED}
      - NEO4J_apoc_import_file_use__neo4j__config=${NEO4J_APOC_IMPORT_FILE_USE_NEO4J_CONFIG}
      - NEO4J_PLUGINS=${NEO4J_PLUGINS}
    volumes:
      - ./neo4j_db/data:/data
      - ./neo4j_db/logs:/logs
      - ./neo4j_db/import:/var/lib/neo4j/import
      - ./neo4j_db/plugins:/plugins
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    ports:
      - 11434:11434
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
volumes:
  ollama_data: